<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer requirements | NexHaat</title><link rel="stylesheet" href="css/app.css"></head><body><main class="page wide"><header><a class="brand" href="index.html">NEXHAAT</a><nav><a href="buyer-requirements.html" class="active">Requirements</a><a href="dashboard.html">My Dashboard</a><button id="signOut" class="link">Sign out</button></nav></header><p class="eyebrow">BUYER REQUIREMENTS</p><h1>What buyers are looking for.</h1><section class="card" id="postSection"><p class="eyebrow">POST A REQUIREMENT</p><form id="requirementForm"><label>Crop<input name="crop" required placeholder="e.g. Tomato"></label><label>Quantity (quintals)<input name="quantity" type="number" min="0.1" step="0.1" required></label><label>Quality<select name="quality"><option value="Grade-A">Grade A</option><option value="Grade-B">Grade B</option><option value="Grade-C">Grade C</option></select></label><label>Delivery location<input name="location" required placeholder="e.g. Pune"></label><label>Offer price / quintal<input name="price" type="number" min="1" required></label><button class="button" type="submit">Post requirement</button><p class="message" id="formMessage" aria-live="polite"></p></form></section><section class="card"><p class="eyebrow">OPEN REQUIREMENTS</p><div id="requirementList" class="lots"></div></section></main><script src="js/buyer-requirements.js"></script></body></html>

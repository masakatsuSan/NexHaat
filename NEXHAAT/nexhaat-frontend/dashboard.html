<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My farm | NexHaat</title><link rel="stylesheet" href="css/app.css"></head><body><main class="page wide"><header><a class="brand" href="index.html">NEXHAAT</a><nav><a href="dashboard.html" class="active">My Farm</a><a href="market.html">Market Prices</a><a href="recommend.html">Best Mandi</a><button id="signOut" class="link">Sign out</button></nav></header><p class="eyebrow">FARMER DASHBOARD</p><h1 id="welcome">My farm</h1><div class="stats"><article><span>Active lots</span><strong id="lotCount">—</strong></article><article><span>Total quantity</span><strong id="quantityTotal">—</strong></article></div><div class="grid"><section class="card"><p class="eyebrow">POST A LOT</p><h2>List your produce</h2><form id="lotForm"><label>Crop<input name="crop" required placeholder="e.g. Onion"></label><label>Quantity (quintals)<input name="quantity" type="number" min="0.1" step="0.1" required></label><label>Quality<select name="quality" required><option value="Grade-A">Grade A</option><option value="Grade-B">Grade B</option><option value="Grade-C">Grade C</option></select></label><label>Location<input name="location" required placeholder="Village or mandi"></label><label>Expected price / quintal (optional)<input name="expected_price" type="number" min="0"></label><button class="button" type="submit">Publish lot</button><p class="message" id="lotMessage" aria-live="polite"></p></form></section><section class="card"><p class="eyebrow">MY LISTINGS</p><h2>Published lots</h2><div id="lotList" class="lots"></div></section></div><p class="actions"><a class="button" href="market.html">Compare Market Prices</a><a class="button" href="recommend.html">Find Best Mandi</a></p></main><script src="js/dashboard.js"></script></body></html>

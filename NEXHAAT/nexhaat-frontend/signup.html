<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | NexHaat</title><link rel="stylesheet" href="css/app.css"></head><body><main class="page"><header><a class="brand" href="index.html">NEXHAAT</a></header><section class="card"><p class="eyebrow">FARMER REGISTRATION</p><h1>Create your account.</h1><form id="loginForm"><label>Full name<input name="name" required placeholder="e.g. Ramesh Kumar"></label><label>Mobile number<input name="phone" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" required></label><label>District<input name="district" required placeholder="e.g. Pune"></label><label>State<input name="state" placeholder="e.g. Maharashtra"></label><input type="hidden" name="role" value="FARMER"><label>OTP<button type="button" id="sendOtp" class="link">Send OTP</button><input name="otp" inputmode="numeric" maxlength="6" required></label><button class="button" type="submit">Register</button><p class="message" id="message" aria-live="polite"></p></form><p>Already have an account? <a href="login.html">Sign in</a></p></section></main><script src="js/auth.js"></script></body></html>

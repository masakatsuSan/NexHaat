<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | NexHaat</title><link rel="stylesheet" href="css/app.css"></head><body><main class="page"><header><a class="brand" href="index.html">NEXHAAT</a></header><section class="card"><p class="eyebrow">FARMER SIGN IN</p><h1>Welcome back.</h1><form id="loginForm"><label>Mobile number<input name="phone" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" required></label><button type="button" id="sendOtp">Send OTP</button><label>OTP<input name="otp" inputmode="numeric" maxlength="6" required></label><label class="hidden">Name<input name="name" value="Returning farmer"></label><label class="hidden">District<input name="district" value="Not set"></label><button class="button" type="submit">Sign in</button><p class="message" id="message" aria-live="polite"></p></form><p>New to NexHaat? <a href="signup.html">Register</a></p></section></main><script src="js/auth.js"></script></body></html>
